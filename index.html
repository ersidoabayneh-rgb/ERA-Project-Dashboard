<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethiopian Roads Administration ERP Dashboard</title>
    <meta name="description" content="A comprehensive responsive road construction project dashboard aligning with PMBOK 8th edition, EVM, and FIDIC standards for the Ethiopian Roads Administration." />
    <meta property="og:title" content="Ethiopian Roads Administration ERP Dashboard" />
    <meta property="og:description" content="A comprehensive responsive road construction project dashboard aligning with PMBOK 8th edition, EVM, and FIDIC standards for the Ethiopian Roads Administration." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement, StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';
      import App from '/src/App.tsx';
      import '/src/index.css';

      const rootElement = document.getElementById('root');
      if (rootElement) {
        createRoot(rootElement).render(
          createElement(StrictMode, null, createElement(App))
        );
      }
    </script>
  </body>
</html>
